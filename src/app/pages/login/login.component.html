<div class="login-page d-flex">

  <nav class="container-fluid px-5 py-3">
    <img [src]="logo" alt="Netflix Logo" class="netflix-logo">
  </nav>
  <div class="container d-flex justify-content-center">
    <div class="login-card">
      <h2 class="text-light m-4">Sign in</h2>
      <form (ngSubmit)="onSubmit()" action="">
        <div class="row ">
          <input class="form-control mb-2 bg-dark " type="email" name="email" [(ngModel)]="email"
            placeholder="Email or phone number">
          <input class="form-control  mb-2 bg-dark " type="password" name="password" [(ngModel)]="password"
            id="exampleInputPassword1" placeholder="Password">
          <input type="submit" value="Sign in" class="btn btn-danger d-flex justify-content-center">
        </div>
      </form>


    </div>
  </div>


</div>
